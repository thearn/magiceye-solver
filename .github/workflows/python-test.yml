name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x' # Use a recent Python 3 version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest # Ensure pytest is installed
    - name: Test with pytest and coverage
      run: |
        pytest --cov=magiceye_solve --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        fail_ci_if_error: true

    - name: Deploy to Hugging Face Spaces
      if: success() && github.ref == 'refs/heads/main'
      run: |
        # Install git-lfs if not already available
        git lfs install
        
        # Clone the Hugging Face Space repository
        git clone https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }} hf-space
        cd hf-space
        
        # Configure git with a generic user (required for pushing)
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        
        # Copy files from the main repo (excluding .git and other unnecessary files)
        rsync -av --exclude='.git' --exclude='hf-space' --exclude='.github' ../ ./
        
        # Add all changes
        git add .
        
        # Check if there are any changes to commit
        if git diff --staged --quiet; then
          echo "No changes to deploy"
        else
          # Commit and push changes
          git commit -m "Auto-deploy from GitHub Actions"
          git push https://huggingface-user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }}
        fi
